spring.application.name=SonidoVivo
server.port=8080

# Base de datos del proyecto (ajusta usuario/contrasena de tu MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/sonidovivo
spring.datasource.username=root
spring.datasource.password=

# La estructura la controlan las migraciones de Flyway, no Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true
