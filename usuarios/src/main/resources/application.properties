# Nombre de la aplicación (el Gateway la busca en Eureka como lb://usuarios).
spring.application.name=usuarios

# Servidor: localhost. Base de datos: sonidovivo_usuarios (se crea sola si no existe).
spring.datasource.url=jdbc:mysql://localhost:3306/sonidovivo_usuarios?createDatabaseIfNotExist=true

# Usuario para conectarse a MySQL (Laragon).
spring.datasource.username=root
spring.datasource.password=

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate solo valida; las tablas las crea Flyway.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# El microservicio estará disponible en http://localhost:8081.
server.port=8081

# Para que los mensajes de error lleguen a React.
spring.web.error.include-message=always

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migracion

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Swagger: http://localhost:8081/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
