# Nombre de la aplicación.
spring.application.name=api-gateway

# React se conecta aquí: http://localhost:8080
server.port=8080

# Dónde está el servidor Eureka.
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# ---------------- RUTAS ----------------
# Usuarios -> 8081
spring.cloud.gateway.server.webflux.routes[0].id=usuarios
spring.cloud.gateway.server.webflux.routes[0].uri=lb://usuarios
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/usuarios/**,/api/auth/**

# Productos -> 8083
spring.cloud.gateway.server.webflux.routes[1].id=productos
spring.cloud.gateway.server.webflux.routes[1].uri=lb://productos
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/productos/**

# Categorias -> 8083
spring.cloud.gateway.server.webflux.routes[2].id=categorias
spring.cloud.gateway.server.webflux.routes[2].uri=lb://productos
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/categorias/**

# Ofertas -> 8083
spring.cloud.gateway.server.webflux.routes[3].id=ofertas
spring.cloud.gateway.server.webflux.routes[3].uri=lb://productos
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/ofertas/**

# Pedidos -> 8084
spring.cloud.gateway.server.webflux.routes[4].id=pedidos
spring.cloud.gateway.server.webflux.routes[4].uri=lb://pedidos
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/pedidos/**

# Carrito -> 8085
spring.cloud.gateway.server.webflux.routes[5].id=carrito
spring.cloud.gateway.server.webflux.routes[5].uri=lb://carrito
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/carrito/**

# Mensajeria (contactos) -> 8082
spring.cloud.gateway.server.webflux.routes[6].id=mensajeria
spring.cloud.gateway.server.webflux.routes[6].uri=lb://mensajeria
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/api/contactos/**

# ---------------- CORS ----------------
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-origins=http://localhost:5173
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.server.webflux.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
